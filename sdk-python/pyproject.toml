[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-sdk"
version = "0.2.0"
description = "SDK client Python pour le moteur de notification et messagerie temps réel multi-tenant (protocole binaire 256 octets), avec reconnexion automatique."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "UNLICENSED" }
dependencies = [
    "websockets>=12.0",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = ["mypy>=1.10", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["realtime_sdk*"]

[tool.mypy]
python_version = "3.9"
strict = true
