[package]
name = "realtime-sdk"
version = "0.2.0"
edition = "2021"
rust-version = "1.75"
description = "SDK client Rust pour le moteur de notification et messagerie temps réel multi-tenant (protocole binaire 256 octets)."
license = "UNLICENSED"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
# NOTE : le nom exact de la feature TLS de `tokio-tungstenite` a changé
# entre versions majeures ("rustls-tls-webpki-roots" ici, vs "native-tls"
# ou "rustls-tls-native-roots" selon les releases). À vérifier contre la
# version résolue par `cargo add` chez vous — non validable ici faute
# d'accès réseau/registre de crates dans cet environnement.
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
futures-util = "0.3"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
tracing = "0.1"
rand = "0.8"
# Pour `publish_template()` uniquement : un appel REST JSON ponctuel
# (`POST /api/v1/messages/template`), hors du flux WS binaire. `rustls`
# plutôt que `native-tls`/OpenSSL pour rester cohérent avec le choix déjà
# fait pour `tokio-tungstenite` ci-dessus (pas de dépendance OpenSSL native
# à builder/vendorer), et `default-features = false` pour ne pas tirer les
# features `reqwest` inutiles à ce SDK (cookies, multipart, etc.).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "signal"] }
