# Serves the built SPA; all non-file routes fall back to index.html so
# react-router-dom's client-side routes resolve on a hard refresh.
#
# Security headers: this app stores an Admin API bearer token in
# localStorage (see adminAuth.store.ts) — CSP is the primary defense
# against the XSS needed to steal it, since there's no httpOnly-cookie
# alternative available to a static SPA talking to an arbitrary
# operator-chosen backend URL.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src *; frame-ancestors 'none'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
