[package]
name = "realtime-engine"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "signal", "sync", "io-util"] }
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "http2", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
subtle = "2"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "aio", "connection-manager", "streams"] }
async-trait = "0.1"
prometheus = "0.13"
tower-http = { version = "0.5", features = ["cors"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate", "uuid", "chrono"] }
argon2 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
p256 = { version = "0.13.2", features = ["ecdsa", "ecdh", "pkcs8"] }
aes-gcm = "0.10.3"
hkdf = "0.12.4"
url = "2.5.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.24"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
