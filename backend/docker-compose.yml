# docker-compose.yml — exemple pour valider le broadcast multi-instances
# en local : 2 instances du moteur + 1 Redis, derrière un point d'entrée
# unique par instance (pas de load balancer ici, volontairement, pour
# pouvoir se connecter explicitement à l'instance A ou B pendant les tests
# et vérifier qu'un message publié sur A atteint bien un abonné sur B).
#
# Nommage : chaque instance reste un seul processus/binaire qui sert à la
# fois la messagerie temps réel ET l'admin/auth (voir BACKEND.md — pas de
# découpage en microservices ici) ; le nom `service-messengio-*` reflète
# son rôle principal. Dans chacune, deux surfaces logiques distinctes
# cohabitent sur des ports différents :
#   - "messengio"  : WS (8080/8081), TCP (7878/7879), publication HTTP
#                    (même port que Portal, voir modules::realtime::routes)
#   - "guard"      : Admin API (9090/9091) et Portal/Auth API (8090/8091)
#                    — gestion des tenants, comptes, clés
# Un vrai découpage en deux services déployables séparés (un binaire
# "messengio" qui ne sert que WS/TCP, un binaire "guard" qui ne sert que
# admin/auth) est un changement d'architecture à part entière, pas fait ici.
#
# Usage : docker compose up --build
#   Instance A (service-messengio-a) : ws://localhost:8080/ws  (TCP: 7878, Admin/guard: 9090, Portal/guard: 8090)
#   Instance B (service-messengio-b) : ws://localhost:8081/ws  (TCP: 7879, Admin/guard: 9091, Portal/guard: 8091)
#
# Le Portal API (voir modules::portal) est la seule surface avec un état
# durable : chaque instance a son propre fichier SQLite (volume nommé
# dédié), tout le reste redémarre à vide comme d'habitude — cohérent avec
# le fait que les secrets de tenant et les quotas restent eux aussi
# propres à chaque instance (pas de coordination inter-instances).

services:
  service-cache:
    image: redis:7-alpine
    container_name: service-cache
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10

  service-messengio-a:
    build: .
    container_name: service-messengio-a
    depends_on:
      service-cache:
        condition: service_healthy
    environment:
      REDIS_URL: redis://service-cache:6379
      DEMO_TENANT_SECRET: dev-secret-change-me
      ADMIN_API_TOKEN: dev-admin-token-change-me
      PORTAL_SESSION_SECRET: dev-portal-secret-change-me
      PORTAL_DB_PATH: /data/portal.db
      # Web Push (browser notifications, see modules::push::services::WebPushCrypto):
      # both must be set together or Web Push stays disabled (see
      # Settings::vapid_public_key's doc comment for why no dev default is
      # generated the way the secrets above are). Generate a real pair once:
      #   cargo run --example generate_vapid_keys
      # VAPID_PUBLIC_KEY: ...
      # VAPID_PRIVATE_KEY: ...
      # VAPID_SUBJECT: mailto:ops@example.com
    volumes:
      - portal-data-a:/data
    ports:
      - "8080:8080"
      - "7878:7878"
      - "9090:9090" # dev uniquement : ne jamais publier ce port en production
      - "8090:8090"

  service-messengio-b:
    build: .
    container_name: service-messengio-b
    depends_on:
      service-cache:
        condition: service_healthy
    environment:
      REDIS_URL: redis://service-cache:6379
      DEMO_TENANT_SECRET: dev-secret-change-me
      ADMIN_API_TOKEN: dev-admin-token-change-me
      PORTAL_SESSION_SECRET: dev-portal-secret-change-me
      PORTAL_DB_PATH: /data/portal.db
      # Web Push (browser notifications, see modules::push::services::WebPushCrypto):
      # both must be set together or Web Push stays disabled (see
      # Settings::vapid_public_key's doc comment for why no dev default is
      # generated the way the secrets above are). Generate a real pair once:
      #   cargo run --example generate_vapid_keys
      # VAPID_PUBLIC_KEY: ...
      # VAPID_PRIVATE_KEY: ...
      # VAPID_SUBJECT: mailto:ops@example.com
    volumes:
      - portal-data-b:/data
    ports:
      - "8081:8080"
      - "7879:7878"
      - "9091:9090" # dev uniquement : ne jamais publier ce port en production
      - "8091:8090"

volumes:
  portal-data-a:
  portal-data-b:
